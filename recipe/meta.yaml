{% set name = "solarmach" %}
{% set version = "0.5.7" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/solarmach-{{ version }}.tar.gz
  sha256: 972d8a7bba080a8e477d0756c3f01d41f018dcea15bcd19216c2f7004aa3451e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >={{ python_min }}
    - setuptools
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - astropy-base
    - cmasher
    - drms
    - imageio >=2.31.6
    - jinja2
    - lxml
    - matplotlib-base
    - numpy
    - pandas
    - parfive >=2.3.1
    - plotly
    - python-dateutil
    - scipy
    - sunkit-magex
    - sunpy
    - threadpoolctl
    - tqdm
    - zeep

test:
  imports:
    - solarmach
  requires:
    - python >={{ python_min }}
    - pip
    - flake8
    - pytest
    - pytest-doctestplus
    - pytest-cov
  commands:
    - echo "No tests in sdist; skipping pytest."

about:
  home: https://github.com/jgieseler/solarmach
  summary: Multi-spacecraft longitudinal configuration plotter
  license: BSD-3-Clause
  license_file: LICENSE.rst

extra:
  recipe-maintainers:
    - jgieseler
